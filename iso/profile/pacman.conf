#
# Build-time pacman configuration of the installer image, adapted from the
# archiso releng profile. Every repository is the Arch Linux Archive at the
# date pinned in iso/build-inputs.yml, and nothing else. Every package needs
# a valid signature from the builder's keyring; an unsigned database is
# accepted because the archive serves none (see ADR 0001, Reproducibility).
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional

[core]
Server = https://archive.archlinux.org/repos/2026/10/25/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/25/$repo/os/$arch
